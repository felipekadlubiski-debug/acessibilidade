<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança Digital para Idosos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA DE ACESSIBILIDADE -->
    <nav class="barra-acessibilidade" aria-label="Controles de Acessibilidade">
        <button id="btnAumentaTexto" class="botao-controle" title="Aumentar texto">A+ Aumentar</button>
        <button id="btnDiminuiTexto" class="botao-controle" title="Diminuir texto">A- Diminuir</button>
        <button id="btnVoz" class="botao-controle botao-leitura">🔊 Ouvir Página</button>
        <button id="btnPararVoz" class="botao-controle" onclick="pararLeitura()">⏹️ Parar</button>
    </nav>

    <!-- BANNER INICIAL -->
    <header class="banner">
        <h1>Segurança Digital para Idosos</h1>
        <button class="botao-ajuda">Abrir Modal de Ajuda</button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (O que será lido em voz alta) -->
    <main>
        <section>
            <h2>Dicas Principais</h2>
            <p>Aprenda a navegar na internet com total segurança e evite golpes digitais.</p>
        </section>
    </main>

    <!-- MODAL DE AJUDA -->
    <div class="modal-fundo">
        <div class="modal-conteudo">
            <h2>Precisa de ajuda?</h2>
            <p>Entre em contato com o suporte ou peça auxílio a um familiar de confiança.</p>
            <button class="botao-ajuda botao-fechar">Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
